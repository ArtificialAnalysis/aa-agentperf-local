[package]
name = "agentperf-local-rustcore"
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "agentperf_local_rustcore"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
bytes = "1"
futures-util = "0.3"
pyo3 = { version = "0.29", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
