[project]
name = "agentperf-local"
version = "0.1.0"
description = "Replay recorded agent tasks against an OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Artificial Analysis" }]
dependencies = [
    "httpx>=0.27.0",
    "huggingface-hub>=1.29.0",
    "orjson>=3.10.0",
    "textual>=8.2.8,<9.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
rust = ["agentperf-local-rustcore==0.1.0"]

[project.scripts]
agentperf-local = "agentperf_local.cli:main"

[project.urls]
Homepage = "https://artificialanalysis.ai"
Documentation = "https://github.com/ArtificialAnalysis/aa-agentperf-local/tree/main/docs"
Issues = "https://github.com/ArtificialAnalysis/aa-agentperf-local/issues"
Source = "https://github.com/ArtificialAnalysis/aa-agentperf-local"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
agentperf-local-rustcore = { path = "rustcore" }

[tool.uv.build-backend]
module-name = "agentperf_local"
module-root = ""
source-include = [
    "docs/**",
    "docker/**",
    "scripts/**",
    "rustcore/**",
    "tests/**",
    "Cargo.lock",
    "Cargo.toml",
    "Makefile",
    "uv.lock",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "jsonschema>=4.25.1,<5.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.14.0,<0.16.0",
    "ty>=0.0.75,<0.1.0",
]
