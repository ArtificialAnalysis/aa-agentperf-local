[project]
name = "agentperf-local"
version = "0.3.1"
description = "Replay recorded agent tasks against an OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Artificial Analysis" }]
dependencies = [
    "httpx>=0.27.0",
    "huggingface-hub>=1.29.0",
    "jsonschema>=4.25.1,<5.0.0",
    "orjson>=3.10.0",
    "pydantic>=2.11",
    "pyyaml>=6.0.0",
    "textual>=8.2.8,<9.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
rust = ["agentperf-local-rustcore==0.3.1"]

[project.scripts]
agentperf-local = "agentperf_local.cli:main"

[project.urls]
Homepage = "https://artificialanalysis.ai"
Documentation = "https://github.com/ArtificialAnalysis/aa-agentperf-local/tree/main/docs"
Issues = "https://github.com/ArtificialAnalysis/aa-agentperf-local/issues"
Source = "https://github.com/ArtificialAnalysis/aa-agentperf-local"

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
agentperf-local-rustcore = { path = "rustcore" }

[tool.hatch.build.targets.wheel]
packages = ["agentperf_local"]

# The recipes live at the repository root so they are easy to find and add to.
# The wheel carries a copy inside the package.
[tool.hatch.build.targets.wheel.force-include]
"recipes" = "agentperf_local/data/recipes"

[tool.hatch.build.targets.sdist]
include = [
    "agentperf_local/**",
    "recipes/**",
    "docs/**",
    "docker/**",
    "scripts/**",
    "rustcore/**",
    "tests/**",
    "Cargo.lock",
    "Cargo.toml",
    "Makefile",
    "uv.lock",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.14.0,<0.16.0",
    "ty>=0.0.75,<0.1.0",
    "types-pyyaml>=6.0.12",
]
