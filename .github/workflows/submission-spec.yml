name: Submission spec

# The client sends bodies that match its pinned copy of the service's OpenAPI spec.
# This job fails when the live spec differs from that copy, and prints what changed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: pinned spec matches the live service
    runs-on: ubuntu-latest
    env:
      LIVE_SPEC_URL: https://submit.artificialanalysis.ai/v1/openapi.json
      PINNED_SPEC: agentperf_local/data/submission-openapi.json
      OASDIFF_VERSION: "1.32.1"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the live spec
        run: curl -sSfL -o live-openapi.json "$LIVE_SPEC_URL"
      - name: Install oasdiff
        run: |
          set -Eeuo pipefail
          curl -sSfL -o oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          tar -xzf oasdiff.tar.gz oasdiff
      - name: Print the changelog from the pinned spec to the live spec
        run: ./oasdiff changelog "$PINNED_SPEC" live-openapi.json
      - name: Fail on any difference
        # Key order and whitespace are not differences, so both files are compared as sorted JSON.
        run: |
          set -Eeuo pipefail
          if ! diff <(jq -S . "$PINNED_SPEC") <(jq -S . live-openapi.json); then
            echo "::error::the live spec differs from $PINNED_SPEC; copy it over and update the client"
            exit 1
          fi
