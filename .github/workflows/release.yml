name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches every version string
        run: uv run --locked python scripts/check_release_version.py "$GITHUB_REF_NAME"
      # A release names the commit it was built from, so its submissions carry source_state "release".
      - name: Embed the release commit
        run: git rev-parse HEAD > agentperf_local/data/release-revision.txt
      - name: Build agentperf-local wheel and sdist
        run: uv build --no-sources --out-dir dist/agentperf-local
      # The Rust extension ships as an sdist only; `agentperf-local[rust]` compiles it on install.
      - name: Build agentperf-local-rustcore sdist
        run: uv build rustcore --sdist --no-sources --out-dir dist/rustcore
      - uses: actions/upload-artifact@v4
        with:
          name: dist-agentperf-local
          path: dist/agentperf-local/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dist-rustcore
          path: dist/rustcore/
          if-no-files-found: error

  # PyPI allows one pending trusted publisher per (repository, workflow, environment),
  # so each project publishes from its own environment.
  publish:
    name: publish agentperf-local to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentperf-local
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-agentperf-local
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-rustcore:
    name: publish agentperf-local-rustcore to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-rustcore
      url: https://pypi.org/p/agentperf-local-rustcore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-rustcore
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [publish, publish-rustcore]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
